name: .NET SDK setup (retained legacy action path)
description: Compatibility path for the restored workflow tree; installs no Node/npm and provides the .NET 10 SDK.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: '10.0.x'