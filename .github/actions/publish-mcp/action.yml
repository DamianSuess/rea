name: MCP publication availability gate
description: Preserves the action path but fails closed because the C# MCP server and publication metadata are unavailable.
runs:
  using: composite
  steps:
    - shell: bash
      run: dotnet build dotnet/tools/Rea.Automation/Rea.Automation.csproj --configuration Release --nologo
    - shell: bash
      run: dotnet exec dotnet/tools/Rea.Automation/bin/Release/net10.0/Rea.Automation.dll unavailable mcp-publication