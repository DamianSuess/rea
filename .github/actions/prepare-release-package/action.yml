name: Prepare qualified C# release inputs
description: Download and verify the exact C# package, source SHA and digest.
inputs:
  source_sha:
    description: Exact qualified source SHA
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-dotnet-package
        path: dotnet/artifacts/qualified/
    - shell: bash
      run: dotnet build dotnet/tools/Rea.Automation/Rea.Automation.csproj --configuration Release --nologo
    - shell: bash
      env:
        REA_PACKAGE_DIRECTORY: dotnet/artifacts/qualified
        REA_SOURCE_SHA: ${{ inputs.source_sha }}
      run: dotnet exec dotnet/tools/Rea.Automation/bin/Release/net10.0/Rea.Automation.dll verify-directory-env