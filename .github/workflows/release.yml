name: Release qualification
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Qualify C# artifacts; publication requires restored governance/provider contracts
        type: choice
        options: [prepare, publish]
        default: prepare
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Rea.slnx --configuration Release --nologo
      - run: dotnet exec scripts/bin/Release/net10.0/Rea.Validation.dll repository .
      - run: dotnet exec scripts/bin/Release/net10.0/Rea.Validation.dll test-hygiene . dotnet/artifacts/reports/test-results.json
      - run: dotnet exec dotnet/tools/Rea.Automation/bin/Release/net10.0/Rea.Automation.dll verify-report dotnet/artifacts/reports/test-results.json
      - run: dotnet pack dotnet/src/Rea.Cli --configuration Release --no-build --output dotnet/artifacts/packages
      - run: dotnet exec dotnet/tests/Rea.Tests/bin/Release/net10.0/Rea.Tests.dll --verify-packages dotnet/artifacts/packages
      - run: dotnet exec scripts/bin/Release/net10.0/Rea.Validation.dll package . dotnet/artifacts/packages
      - name: Qualify exact package and source
        env:
          REA_PACKAGE_DIRECTORY: dotnet/artifacts/packages
          REA_SOURCE_SHA: ${{ github.sha }}
        run: dotnet exec dotnet/tools/Rea.Automation/bin/Release/net10.0/Rea.Automation.dll qualify-directory-env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-dotnet-package
          path: dotnet/artifacts/packages/
          if-no-files-found: error
      - name: Fail closed rather than publish with missing release governance
        if: inputs.phase == 'publish'
        run: dotnet exec dotnet/tools/Rea.Automation/bin/Release/net10.0/Rea.Automation.dll unavailable release-publication
