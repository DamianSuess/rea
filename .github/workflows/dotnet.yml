name: C# migration

on:
  push:
    branches: [main]
    paths: ["dotnet/**", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["dotnet/**", ".github/workflows/dotnet.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: .NET 10 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Rea.slnx --configuration Release --nologo
      - name: Run regression and CLI tests
        run: dotnet exec tests/Rea.Tests/bin/Release/net10.0/Rea.Tests.dll
      - name: Pack CLI preview
        run: dotnet pack src/Rea.Cli --configuration Release --no-build --output artifacts/packages
