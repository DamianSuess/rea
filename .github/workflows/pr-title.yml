name: PR title
on:
  pull_request:
    branches: [main, 'release/*']
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build dotnet/tools/Rea.Automation/Rea.Automation.csproj --configuration Release --nologo
      - name: Validate title as data, never as a shell expression
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: dotnet exec dotnet/tools/Rea.Automation/bin/Release/net10.0/Rea.Automation.dll title