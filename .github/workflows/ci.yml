name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/*']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/dotnet.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}